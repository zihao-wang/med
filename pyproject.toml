[project]
name = "med"
version = "0.1.0"
description = "Minimal Embeddable Dimension — ICML 2026 companion code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "tqdm",
    "cvxpy",
    "requests",
]

[dependency-groups]
dev = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["med*", "unlimit*"]

[tool.setuptools.package-data]
med = ["vocab.txt"]
unlimit = ["vocab.txt"]
